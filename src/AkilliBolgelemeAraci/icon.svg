<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 3D Yumuşak Derinlik ve Gölgelendirme Filtresi -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#020617" flood-opacity="0.45"/>
    </filter>

    <!-- Zone 1: Ticaret & MİA (Kırmızı/Mercan 3D Gradyanlar) -->
    <linearGradient id="comTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="comSide1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="comSide2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>

    <!-- Zone 2: Konut Dokusu (Altın / Kehribar 3D Gradyanlar) -->
    <linearGradient id="resTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="resSide1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="resSide2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Zone 3: Yeşil Kuşak & Donatı (Zümrüt Yeşili 3D Gradyanlar) -->
    <linearGradient id="grnTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="grnSide1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="grnSide2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Zone 4: Teknoloji / Kentsel Dönüşüm / Su (Mavi / Camgöbeği 3D Gradyanlar) -->
    <linearGradient id="bluTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bluSide1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="bluSide2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>

    <!-- Parlayan Beyaz/Buzul Mavi Yol Koridoru -->
    <linearGradient id="roadGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>

  <!-- Tamamen Şeffaf Arka Plan (Boşluksuz / Kenardan Kenara Doku) -->

  <g filter="url(#softGlow)">
    <!-- 1. KUZEY BÖLGE: Ticaret / Merkezi İş Alanı (Yüksek Yoğunluklu 3D Blok) -->
    <polygon points="32,2 47,10 47,17 32,9" fill="url(#comSide1)" opacity="0.95"/>
    <polygon points="32,2 17,10 17,17 32,9" fill="url(#comSide2)" opacity="0.95"/>
    <polygon points="17,10 32,2 47,10 32,18" fill="url(#comTop)"/>
    <!-- İç Ticaret Gökdelen Kütlesi (Ekstrüzyon) -->
    <polygon points="28,4 36,4 36,13 28,13" fill="#ffffff" opacity="0.2"/>
    <polygon points="26,6 32,2.5 38,6 32,9.5" fill="#fecaca"/>
    <polygon points="26,6 32,9.5 32,15 26,11.5" fill="#ef4444"/>
    <polygon points="32,9.5 38,6 38,11.5 32,15" fill="#b91c1c"/>

    <!-- 2. DOĞU BÖLGE: Konut Alanı (Orta-Yüksek Katlı Yapılaşma) -->
    <polygon points="49,12 62,20 62,28 49,20" fill="url(#resSide1)"/>
    <polygon points="34,20 49,12 49,20 34,28" fill="url(#resSide2)"/>
    <polygon points="34,20 49,12 62,20 47,28" fill="url(#resTop)"/>
    <!-- Konut Parselleri / Çatı Detayları -->
    <polygon points="40,19 46,15.5 53,19 47,22.5" fill="#fef3c7"/>
    <polygon points="40,19 47,22.5 47,25.5 40,22" fill="#d97706"/>
    <polygon points="47,22.5 53,19 53,22 47,25.5" fill="#92400e"/>
    <polygon points="50,23 57,19.5 60,21 53,24.5" fill="#fde68a" opacity="0.8"/>

    <!-- 3. BATI BÖLGE: Ekolojik Yeşil Kuşak & Donatı / Park -->
    <polygon points="15,12 30,20 30,28 15,20" fill="url(#grnSide1)"/>
    <polygon points="2,20 15,12 15,20 2,28" fill="url(#grnSide2)"/>
    <polygon points="2,20 17,28 30,20 15,12" fill="url(#grnTop)"/>
    <!-- Yeşil Teras / Park Kademe Katmanı -->
    <polygon points="7,20 15,15.5 24,20 16,24.5" fill="#6ee7b7"/>
    <polygon points="7,20 16,24.5 16,26.5 7,22" fill="#059669"/>
    <polygon points="16,24.5 24,20 24,22 16,26.5" fill="#047857"/>
    <!-- Donatı / Park Odak Prizması -->
    <polygon points="13,17 16,15 19,17 16,19" fill="#a7f3d0"/>

    <!-- 4. GÜNEY-BATI BÖLGE: Kentsel Dönüşüm & Karma Kullanım -->
    <polygon points="17,31 32,23 32,31 17,39" fill="url(#bluSide1)"/>
    <polygon points="4,39 17,31 17,39 4,47" fill="url(#bluSide2)"/>
    <polygon points="4,39 17,31 32,39 19,47" fill="url(#bluTop)"/>
    <!-- 3B Yapı Bloğu -->
    <polygon points="10,38 18,33.5 26,38 18,42.5" fill="#bae6fd"/>
    <polygon points="10,38 18,42.5 18,46 10,41.5" fill="#0284c7"/>
    <polygon points="18,42.5 26,38 26,41.5 18,46" fill="#0369a1"/>

    <!-- 5. GÜNEY-DOĞU BÖLGE: Sanayi / İnovasyon / Kırılganlık Eşiği -->
    <polygon points="47,31 60,39 60,47 47,39" fill="url(#comSide1)" opacity="0.85"/>
    <polygon points="32,23 47,31 47,39 32,31" fill="url(#comSide2)" opacity="0.85"/>
    <polygon points="32,39 47,31 60,39 45,47" fill="url(#comTop)" opacity="0.9"/>
    <!-- Tesis / Depo Bloğu -->
    <polygon points="38,38 46,33.5 54,38 46,42.5" fill="#fca5a5"/>
    <polygon points="38,38 46,42.5 46,45.5 38,41" fill="#e11d48"/>
    <polygon points="46,42.5 54,38 54,41 46,45.5" fill="#9f1239"/>

    <!-- 6. EN GÜNEY ODAK: Birleşen Kentsel Merkez ve Eşik Temeli -->
    <polygon points="32,42 45,50 45,58 32,50" fill="#075985"/>
    <polygon points="19,50 32,42 32,50 19,58" fill="#0c4a6e"/>
    <polygon points="19,50 32,42 45,50 32,58" fill="url(#bluTop)"/>
    <polygon points="25,50 32,45.5 39,50 32,54.5" fill="#e0f2fe"/>
    <polygon points="25,50 32,54.5 32,57 25,52.5" fill="#0284c7"/>
    <polygon points="32,54.5 39,50 39,52.5 32,57" fill="#0369a1"/>
  </g>

  <!-- 3D AKILLI ULAŞIM VE SINIR AYRIM AĞI (Glow Koridorları) -->
  <g stroke="url(#roadGlow)" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M 32 18 L 32 42" stroke-width="2.6"/>
    <path d="M 17 28 L 32 20 L 47 28" stroke-width="2.4"/>
    <path d="M 32 20 L 19 47" stroke-width="2.2"/>
    <path d="M 32 20 L 45 47" stroke-width="2.2"/>
    <path d="M 32 42 L 32 58" stroke-width="2.0"/>
  </g>

  <!-- Kentsel Karar Destek Merkezi / Ana Düğüm Noktası (Nexus) -->
  <circle cx="32" cy="20.5" r="3.2" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
  <circle cx="32" cy="20.5" r="1.4" fill="#0284c7"/>
  <circle cx="32" cy="42" r="2.2" fill="#ffffff" stroke="#0369a1" stroke-width="1.0"/>
</svg>
